server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/html;
    index index.html index.htm index.nginx-debian.html;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /static {
        alias /usr/share/nginx/html/static;
    }

    location /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    location / {
        try_files $uri /index.html;
    }

    location /v1/auth/ {
        set $upstream_aa "nbf-aa-server:5003";
        rewrite ^/v1/auth/(.*) /$1 break;
        proxy_pass http://$upstream_aa;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v1/conf/ {
        set $upstream_conf "nbf-config-server:5000";
        rewrite ^/v1/conf/(.*) /$1 break;
        proxy_pass http://$upstream_conf;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v1/provision/ {
        set $upstream_prov "nbf-provision-server:5001";
        rewrite ^/v1/provision/(.*) /$1 break;
        proxy_pass http://$upstream_prov;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 1h;
        proxy_connect_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /v1/generic/ {
        set $upstream_conn "nbf-connector:4999";
        rewrite ^/v1/generic/(.*) /$1 break;
        proxy_pass http://$upstream_conn;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v1/adminbackend/ {
        set $upstream_admin "nbf-admin-backend:4301";
        rewrite ^/v1/adminbackend/(.*) /$1 break;
        proxy_pass http://$upstream_admin;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v1/newswagger/ {
        set $upstream_swagger "nbf-swagger:4444";
        rewrite ^/v1/newswagger/(.*) /api-docs/$1 break;
        proxy_pass http://$upstream_swagger;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /generic-api/ {
        set $upstream_swagger "nbf-swagger:4444";
        proxy_pass http://$upstream_swagger;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/ {
        set $upstream_agent "nbf-ubfagent:3000";
        proxy_pass http://$upstream_agent;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v1/templatestudio/ {
        set $upstream_studio "nbf-template-studio:5050";
        rewrite ^/v1/templatestudio/(.*) /$1 break;
        proxy_pass http://$upstream_studio;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v1/genericSaw/ {
        set $upstream_agent "nbf-ubfagent:3000";
        rewrite ^/v1/genericSaw/(.*) /$1 break;
        proxy_pass http://$upstream_agent;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v1/tempSaw/ {
        set $upstream_saw "127.0.0.1:3005";
        rewrite ^/v1/tempSaw/(.*) /$1 break;
        proxy_pass http://$upstream_saw;
        proxy_buffering off;
    }

    location /v1/adminBackSaw/ {
        set $upstream_saw "127.0.0.1:3005";
        rewrite ^/v1/adminBackSaw/(.*) /$1 break;
        proxy_pass http://$upstream_saw;
        proxy_buffering off;
    }
}

