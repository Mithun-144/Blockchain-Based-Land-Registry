      FABRIC_CA_SERVER_OPERATIONS_TLS_ENABLED: "false"
    volumes:
      - ${SERVERS_DIR}/ubfagent/vars/keyfiles/peerOrganizations/panchayat.com:/certs
      - ca1.panchayat.com:/etc/hyperledger/fabric-ca-server

  # ===========================================================================
  # STAGE 2: Hyperledger Fabric Consensus (Orderers) & Endorsing Peers
  # ===========================================================================
  orderer1.nic.com:
    image: hyperledger/fabric-orderer:2.2.3
    container_name: orderer1.nic.com
    command: orderer
    restart: unless-stopped
    ports:
      - "7018:7050"
      - "8018:7060"
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_BOOTSTRAPMETHOD: file
      ORDERER_GENERAL_GENESISMETHOD: file
      ORDERER_GENERAL_BOOTSTRAPFILE: /var/hyperledger/orderer/orderer.genesis.block
      ORDERER_GENERAL_GENESISFILE: /var/hyperledger/orderer/orderer.genesis.block
      ORDERER_GENERAL_LOCALMSPID: nic-com
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_OPERATIONS_LISTENADDRESS: orderer1.nic.com:7060
      ORDERER_OPERATIONS_TLS_ENABLED: "false"
      ORDERER_METRICS_PROVIDER: prometheus
    volumes:
      - ${SERVERS_DIR}/ubfagent/vars/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ${SERVERS_DIR}/ubfagent/vars/keyfiles/ordererOrganizations/nic.com/orderers/orderer1.nic.com/msp:/var/hyperledger/orderer/msp
      - ${SERVERS_DIR}/ubfagent/vars/keyfiles/ordererOrganizations/nic.com/orderers/orderer1.nic.com/tls:/var/hyperledger/orderer/tls
      - orderer1.nic.com:/var/hyperledger/production/orderer
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://orderer1.nic.com:7060/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  orderer2.nic.com:
