      retries: 15
      start_period: 5s

  nbf-swagger:
    <<: *nbf-binary
    container_name: nbf-swagger
    working_dir: /app
    command: ["/app/generic-swagger-fabric-api-final-linux"]
    depends_on:
      nbf-ubfagent:
        condition: service_healthy
    ports:
      - "4444:4444"
    environment:
      LOOPBACK_FORWARDS: "3000=nbf-ubfagent:3000"
    volumes:
      - ${NBF_LITE_DIR}/Swagger-Fabric:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4444/api-docs/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  nbf-template-studio:
    <<: *nbf-binary
    container_name: nbf-template-studio
    working_dir: /app
    command: ["/app/chaincode-generating-module-linux"]
    depends_on:
      nbf-mongodb:
        condition: service_healthy
      nbf-ubfagent:
        condition: service_healthy
      nbf-admin-backend:
        condition: service_healthy
    ports:
      - "5050:5050"
    environment:
      LOOPBACK_FORWARDS: "27017=nbf-mongodb:27017 3000=nbf-ubfagent:3000 4301=nbf-admin-backend:4301"
    volumes:
      - ${NBF_LITE_DIR}/Template-Studio-Server-Fabric:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5050/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  nbf-academia-dashboard:
    image: nbf-academia_web
    container_name: nbf-academia-dashboard
    restart: unless-stopped
    command: ["/bin/bash", "-c", "rm -f /etc/nginx/conf.d/*.conf /etc/nginx/sites-enabled/* && cp /etc/nginx/default.compose.conf /etc/nginx/sites-enabled/default && exec nginx -g 'daemon off;'"]
    depends_on:
      nbf-ubfagent:
        condition: service_healthy
      nbf-aa-server:
        condition: service_healthy
      nbf-config-server:
        condition: service_healthy
      nbf-provision-server:
        condition: service_healthy
      nbf-connector:
        condition: service_healthy
      nbf-admin-backend:
        condition: service_healthy
      nbf-swagger:
        condition: service_healthy
      nbf-template-studio:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.compose.conf:/etc/nginx/default.compose.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # ===========================================================================
  # STAGE 4: Other Containers â€” PropChain Backend & Frontend
  # (Start ONLY after NBF-Lite nbf-samplerest is healthy!)
  # ===========================================================================
  propchain-server:
    image: propchain-server:local
    build:
      context: ./server
    container_name: propchain-server
    restart: unless-stopped
    depends_on:
      nbf-samplerest:
        condition: service_healthy
    env_file:
      - ./server/.env
    ports:
      - "3001:3001"
    volumes:
      - ./server/citizenRegistry.json:/app/citizenRegistry.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  propchain-frontend:
    image: propchain-frontend:local
    build:
      context: .
    container_name: propchain-frontend
    restart: unless-stopped
    depends_on:
      nbf-samplerest:
        condition: service_healthy
      propchain-server:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  nbf_mongodb_data:
  ca1.sro.com:
    external: true
  ca1.bank.com:
    external: true
  ca1.judiciary.com:
    external: true
