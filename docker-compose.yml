      LOOPBACK_FORWARDS: "27017=nbf-mongodb:27017 3000=nbf-ubfagent:3000"
    volumes:
      - ${NBF_LITE_DIR}/academia_provision_server:/app
      - ${SERVERS_DIR}:/home/mithun/.servers:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5001'"]
