    container_name: peer1.panchayat.com.couchdb
    ports:
      - "7017:5984"
    volumes:
      - peer1.panchayat.com.couchdb:/opt/couchdb/data

  ca1.sro.com:
    <<: *ca-common
    container_name: ca1.sro.com
    ports:
      - "7000:7054"
      - "8000:9443"
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca1
      FABRIC_CA_SERVER_CA_KEYFILE: /certs/ca/priv_sk
      FABRIC_CA_SERVER_CA_CERTFILE: /certs/ca/ca1.sro.com-cert.pem
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_TLS_KEYFILE: /certs/ca/priv_sk
      FABRIC_CA_SERVER_TLS_CERTFILE: /certs/ca/ca1.sro.com-cert.pem
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_LOGGING_SPEC: INFO
      FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: 127.0.0.1:9443
      FABRIC_CA_SERVER_OPERATIONS_TLS_ENABLED: "false"
    volumes:
      - ${SERVERS_DIR}/ubfagent/vars/keyfiles/peerOrganizations/sro.com:/certs
      - ca1.sro.com:/etc/hyperledger/fabric-ca-server

  ca1.bank.com:
    <<: *ca-common
