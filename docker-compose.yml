  ca1.panchayat.com:
    <<: *ca-common
    container_name: ca1.panchayat.com
    ports:
      - "7005:7054"
      - "8005:9443"
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca1
