  nbf-tools:
    image: hyperledger/fabric-tools:2.2.3
    container_name: nbf-lite_default
    command: /bin/sh
    tty: true
    stdin_open: true
    restart: unless-stopped
    working_dir: /go
    depends_on:
      peer1.sro.com:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SERVERS_DIR}/ubfagent/vars:/vars
      - ${SERVERS_DIR}/ubfagent/vars/chaincode:/go/src/github.com/chaincode

  # ===========================================================================
  # STAGE 3: NBF-Lite Middleware & Academia Services (wait for Fabric + MongoDB)
  # ===========================================================================
  nbf-ubfagent:
    image: nbf-ubfagent:local
    build:
      context: .
      dockerfile: docker/nbf-ubfagent/Dockerfile
    container_name: nbf-ubfagent
    restart: unless-stopped
    working_dir: /home/mithun/.servers/ubfagent
    depends_on:
      peer1.sro.com:
        condition: service_healthy
      peer1.bank.com:
        condition: service_healthy
      peer1.judiciary.com:
        condition: service_healthy
      peer1.revenue.com:
        condition: service_healthy
      peer1.municipal.com:
        condition: service_healthy
      peer1.panchayat.com:
        condition: service_healthy
      orderer1.nic.com:
        condition: service_healthy
      orderer2.nic.com:
        condition: service_healthy
      orderer3.nic.com:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ${SERVERS_DIR}/ubfagent:/home/mithun/.servers/ubfagent
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  nbf-samplerest:
    image: nbf-samplerest:local
    build:
      context: .
      dockerfile: docker/nbf-samplerest/Dockerfile
    container_name: nbf-samplerest
    restart: unless-stopped
    working_dir: /app
    depends_on:
      peer1.sro.com:
        condition: service_healthy
      peer1.bank.com:
        condition: service_healthy
      peer1.judiciary.com:
        condition: service_healthy
      peer1.revenue.com:
        condition: service_healthy
      peer1.municipal.com:
        condition: service_healthy
      peer1.panchayat.com:
        condition: service_healthy
      orderer1.nic.com:
        condition: service_healthy
      orderer2.nic.com:
        condition: service_healthy
      orderer3.nic.com:
        condition: service_healthy
      ca1.sro.com:
        condition: service_healthy
      ca1.bank.com:
        condition: service_healthy
      ca1.judiciary.com:
        condition: service_healthy
      ca1.revenue.com:
        condition: service_healthy
      ca1.municipal.com:
        condition: service_healthy
      ca1.panchayat.com:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      FABRIC_DOCKER_CCP: /app/channel1_connection_for_docker.json
      FABRIC_DISABLE_DISCOVERY: "true"
    volumes:
      - ${SERVERS_DIR}/nbf-samplerest:/app
      - ${SERVERS_DIR}/ubfagent/vars:/home/mithun/.servers/ubfagent/vars:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/fabric/v1/health').then(async r=>{const d=await r.json();process.exit(r.ok&&d.sFlag?0:1);}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  nbf-admin-backend:
    <<: *nbf-binary
    container_name: nbf-admin-backend
    working_dir: /app
    command: ["/app/admin-backend-server-linux"]
    depends_on:
      nbf-mongodb:
        condition: service_healthy
      nbf-ubfagent:
        condition: service_healthy
    ports:
      - "4301:4301"
    environment:
      LOOPBACK_FORWARDS: "27017=nbf-mongodb:27017 3000=nbf-ubfagent:3000"
    volumes:
      - ${NBF_LITE_DIR}/Admin-Backend-Server-Fabric:/app
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4301'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  nbf-aa-server:
    <<: *nbf-binary
    container_name: nbf-aa-server
    working_dir: /app
    command: ["/app/AA-Server-linux"]
    depends_on:
      nbf-mongodb:
        condition: service_healthy
      nbf-ubfagent:
        condition: service_healthy
    ports:
      - "5003:5003"
    environment:
      LOOPBACK_FORWARDS: "27017=nbf-mongodb:27017 3000=nbf-ubfagent:3000"
    volumes:
