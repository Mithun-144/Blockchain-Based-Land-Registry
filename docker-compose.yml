    working_dir: /app
    command: ["/app/connector-linux"]
    depends_on:
      nbf-mongodb:
        condition: service_healthy
      nbf-ubfagent:
        condition: service_healthy
    ports:
      - "4999:4999"
    environment:
      LOOPBACK_FORWARDS: "27017=nbf-mongodb:27017 3000=nbf-ubfagent:3000"
    volumes:
      - ${NBF_LITE_DIR}/nbf_c:/app
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4999'"]
      interval: 5s
