# PropChain + NBF-Lite End-to-End Docker Compose Stack
#
# Startup ordering (enforced via healthcheck + depends_on: condition: service_healthy):
#   Stage 1: Databases & CAs   -> nbf-mongodb, peer1.*.com.couchdb (x6), ca1.*.com (x6)
#   Stage 2: Fabric Network    -> orderer1..3.nic.com (x3), peer1.*.com (x6)
#   Stage 3: NBF-Lite Services -> nbf-ubfagent, nbf-samplerest (:4000), NBF Academia services & UI (:80)
#   Stage 4: Other Containers  -> propchain-server (:3001), propchain-frontend (:5173)
#
# Run from this repo root (in WSL at /mnt/c/Users/mithu/Downloads/NBF-Lite/app):
#   cp .env.example .env && cp server/.env.example server/.env
#   docker compose up -d --build

x-ca-common: &ca-common
  image: hyperledger/fabric-ca:1.4
  command: fabric-ca-server start -b admin:adminpw --cfg.affiliations.allowremove --cfg.identities.allowremove
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9443/healthz"]
    interval: 5s
    timeout: 5s
    retries: 15
    start_period: 5s

x-couchdb-common: &couchdb-common
  image: hyperledger/fabric-couchdb:latest
  restart: unless-stopped
  environment: &couchdb-env
    COUCHDB_USER: admin
    COUCHDB_PASSWORD: adminpw
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://admin:adminpw@127.0.0.1:5984/_up"]
    interval: 5s
    timeout: 5s
    retries: 15
    start_period: 5s

x-nbf-binary: &nbf-binary
  image: nbf-binary-runner:local
  build:
    context: ./docker/nbf-binary
  restart: unless-stopped

services:
  # ===========================================================================
  # STAGE 1: Core Databases & Fabric Certificate Authorities
  # ===========================================================================
  nbf-mongodb:
    image: mongo:4.4
    container_name: nbf-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - nbf_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  peer1.sro.com.couchdb:
    <<: *couchdb-common
    container_name: peer1.sro.com.couchdb
    ports:
      - "7012:5984"
    volumes:
      - peer1.sro.com.couchdb:/opt/couchdb/data

  peer1.bank.com.couchdb:
    <<: *couchdb-common
    container_name: peer1.bank.com.couchdb
    ports:
      - "7013:5984"
    volumes:
      - peer1.bank.com.couchdb:/opt/couchdb/data

  peer1.judiciary.com.couchdb:
    <<: *couchdb-common
    container_name: peer1.judiciary.com.couchdb
