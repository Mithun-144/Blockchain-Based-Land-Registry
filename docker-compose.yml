      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer1.sro.com:7051
      CORE_PEER_LOCALMSPID: sro-com
      CORE_CHAINCODE_LOGGING_LEVEL: DEBUG
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: peer1.sro.com.couchdb:5984
