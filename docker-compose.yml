      FABRIC_CA_SERVER_CA_KEYFILE: /certs/ca/priv_sk
      FABRIC_CA_SERVER_CA_CERTFILE: /certs/ca/ca1.bank.com-cert.pem
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_TLS_KEYFILE: /certs/ca/priv_sk
      FABRIC_CA_SERVER_TLS_CERTFILE: /certs/ca/ca1.bank.com-cert.pem
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_LOGGING_SPEC: INFO
      FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: 127.0.0.1:9443
      FABRIC_CA_SERVER_OPERATIONS_TLS_ENABLED: "false"
    volumes:
      - ${SERVERS_DIR}/ubfagent/vars/keyfiles/peerOrganizations/bank.com:/certs
      - ca1.bank.com:/etc/hyperledger/fabric-ca-server

  ca1.judiciary.com:
